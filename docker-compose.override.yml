services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    # Opt-in only: not started by a plain `docker compose up`.
    # Start it with: docker compose --profile proxy up
    profiles: ["proxy"]
    image: traefik:3.0
    ports:
      - "80:80"
      - "8090:8080"
    command:
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=ERROR
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  # Local Dockerized Postgres. Uses the same POSTGRES_* creds from .env, so the
  # backend connects to it by overriding POSTGRES_SERVER=db below (instead of the
  # external Render host). Data persists in the app-db-data named volume.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}
    ports:
      # Host 5432 is often taken by a local Postgres; publish on 5433.
      # The backend still reaches it internally as db:5432 over the compose network.
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # adminer:
  #   restart: "no"
  #   ports:
  #     - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command: bash -c "bash scripts/prestart.sh && fastapi run --reload app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/htmlcov:/app/config/application_default_credentials.json
    environment:
      # Point the backend at the local Dockerized Postgres (service name "db")
      # instead of the external host in .env. Creds still come from .env.
      POSTGRES_SERVER: db
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      GOOGLE_APPLICATION_CREDENTIALS: /app/config/application_default_credentials.json

  mailcatcher:
    profiles: ["mailcatcher"]
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000

  playwright:
    profiles: ["playwright"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/blob-report
      - ./frontend/test-results:/app/test-results
    ports:
      - 9323:9323

volumes:
  app-db-data:

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
